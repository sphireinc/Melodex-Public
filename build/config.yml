# Build metadata and development configuration for Wails 3.
version: '3'

info:
  companyName: "Sphire"
  productName: "Melodex"
  productIdentifier: "com.sphire.melodex"
  description: "Local-first personal music library manager"
  copyright: "(c) 2026, Sphire"
  comments: "Melodex desktop music library"
  version: "0.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations: []
other: []
