name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.0-dev

      - name: Go tests
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify legal and third-party metadata
        run: node scripts/check-third-party-notices.mjs

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  security-paths:
    name: security-paths (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.0-dev

      - name: Run application path and media-server symlink tests
        run: go test . -run 'TestValidatePathWithinRoots|TestMediaServer.*Symlink' -count=1

  security-paths-windows:
    name: security-paths (windows)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run pure Windows path and symlink tests
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/pathsecurity -run 'TestValidatePathWithinRoots|TestWindowsSymlinkPolicyRequiresSymlinkSupport' -count=1
